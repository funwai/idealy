services:
  # Must be a Web Service (Node), not a Static Site — deep links like
  # /Insights and /About need server.js to rewrite to index.html.
  - type: web
    name: kurio-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run serve
    envVars:
      - key: NODE_ENV
        value: production







services:
  # www.kurio-ai.com is served as a Render Static Site (CDN).
  # Deep links like /Insights need a rewrite to index.html for React Router.
  - type: web
    name: kurio-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

services:
  - type: web
    name: funwai-rag-api
    env: python
    rootDir: backend/rag-api
    buildCommand: pip install -r requirements.txt
    # Single worker to stay within Render memory limits (exit 137 = OOM)
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      # FIREBASE_SERVICE_ACCOUNT_JSON should be set in Render dashboard
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false  # Don't commit this value
    healthCheckPath: /
